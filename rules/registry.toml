level = "error"
method = "regex"
scope = ["all"]
status = "문서 규칙만 존재"
pattern = '\*\*[^*]+\*\*\s*[:—-]'
sources = ["세 저장소 CLAUDE.md 대시 규칙"]
note = "vcf-private-ai의 콜론 라벨 353건을 변환한 뒤 오류로 승격했다(2026-10-06 결정, vcf-private-ai#69)."
bad = "**배경**: 본문"
good = "**배경.** 본문"

[[rules]]
