method = "claude"
scope = ["all"]
status = "신규"
sources = ["전역 지침 03"]

# ---------------------------------------------------------------------------
# 링크
# ---------------------------------------------------------------------------
criteria = "코드 펜스 안에 명령, 설정, 코드, 마크업이 아닌 일반 문장이나 표 대용 텍스트가 들어 있으면 위반입니다. 다이어그램 문법(mermaid 등)은 코드로 봅니다."

[[rules]]
id = "LINK-TARGET"
title = "상대 링크, 앵커, 저장소 간 링크의 대상 존재"
