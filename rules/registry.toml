exceptions = ["플랫폼 가이드로 연결하는 안내 문장"]
allow = ['^.*github\.com/JaeHoYun/vcf-private-ai.*$']

[[rules]]
id = "CNT-ANONYMIZE"
title = "특정 기업 사례 금지, 업종과 업무 유형 수준으로 일반화"
level = "error"
method = "wordlist"
scope = ["all"]
status = "신규"
sources = ["세 저장소 CLAUDE.md 작성 원칙(익명화)"]
words_source = "Actions secret CUSTOMER_NAMES"
note = "고객사 이름 목록은 공개 저장소에 기록하지 않는다. secret이 없으면 이 검사를 건너뛰고 건너뛴 사실을 출력한다."

[[rules]]
id = "CNT-JUDGMENT"
title = "적합한 경우, 적합하지 않은 경우, 장단점을 함께 서술"
level = "review"
method = "claude"
scope = ["all"]
status = "문서 규칙만 존재"
sources = ["세 저장소 CLAUDE.md 작성 원칙(판단 기준)"]
criteria = "새로 추가한 방식, 구성, 도구 권고가 절차만 적고 언제 적합한지와 장단점을 적지 않았으면 위반입니다. 단순 사실 서술과 용어 정의는 대상이 아닙니다."

[[rules]]
id = "CNT-MISFIT"
title = "권하는 접근이 맞지 않는 조건과 그때의 대안을 서술"
level = "review"
method = "claude"
scope = ["all"]
status = "문서 규칙만 존재"
sources = ["세 저장소 CLAUDE.md 작성 원칙(맞지 않는 조건도 적기)"]
criteria = "권하는 접근을 새로 추가하면서 그 접근이 맞지 않는 조건과 그때의 대안을 같은 절에 적지 않았으면 위반입니다."

[[rules]]
id = "CNT-FIVE-ELEMENTS"
title = "운영 기준은 무엇을, 어떤 기준으로, 누가 언제, 어떻게 측정, 어떻게 개선의 다섯 요소로 서술"
level = "review"
method = "claude"
scope = ["vcf-private-ai", "vcf-private-ai-apps"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CLAUDE.md 작성 원칙(양식 대신 운영 기준)", "vcf-private-ai-apps/CLAUDE.md 작성 원칙"]
criteria = "운영 기준(점검, 측정, 판정 기준)을 새로 서술하면서 무엇을, 어떤 기준으로, 누가 언제, 어떻게 측정하고, 어떻게 개선하는지 가운데 빠진 요소가 있으면 위반입니다."

[[rules]]
id = "CNT-FILLED-EXAMPLE"
title = "AX 가이드는 양식 대신 끝까지 채운 가상 예시 수록"
level = "review"
method = "claude"
scope = ["enterprise-ax-methodology"]
status = "문서 규칙만 존재"
sources = ["enterprise-ax-methodology/CLAUDE.md 5절(안내와 양식의 분리)"]
criteria = "빈칸 양식이나 채워 넣을 자리만 있는 표를 추가했으면 위반입니다. 끝까지 채운 가상 예시로 바꿔야 합니다."

[[rules]]
id = "CNT-SOURCE-QUALITY"
title = "핵심 수치는 1차 출처까지 추적, 통제 실험인지 조건이 다른 비교인지 구분"
level = "review"
method = "owner"
scope = ["all"]
status = "신규"
sources = ["전역 지침 judgment(1차 출처 추적)"]

# ---------------------------------------------------------------------------
# 문체
# ---------------------------------------------------------------------------
criteria = "핵심 수치의 출처가 2차 자료(블로그, 기사, 리뷰)이거나, 조건이 다른 결과를 나란히 놓고 비교했으면 소유자 확인 항목으로 요약에만 적습니다."

[[rules]]
id = "PRS-CONCLUSION-FIRST"
title = "결론을 먼저, 근거를 뒤에"
level = "review"
method = "claude"
scope = ["all"]
status = "신규"
sources = [
  "전역 지침 style",
  "skill-vault:skills/narrative-architect/principles/prose-voice.md 3절",
]
criteria = "단락이나 절이 배경과 근거를 길게 나열한 뒤 마지막에야 결론을 제시하면 위반입니다. 결론 문장을 앞으로 옮기는 수정안을 제시합니다."

[[rules]]
id = "PRS-ONE-MEANING"
title = "한 문장에 한 의미, 주어와 서술어를 가깝게 배치"
level = "review"
method = "claude"
scope = ["all"]
status = "신규"
sources = ["전역 지침 style"]
criteria = "한 문장에 서로 다른 주장이 둘 이상 들어 있거나, 수식어가 겹쳐 해석이 둘 이상으로 갈리거나, 주어와 서술어가 멀어 끝까지 읽어야 뜻이 잡히면 위반입니다."

[[rules]]
id = "PRS-TERM-FIRST-USE"
title = "핵심 용어는 처음 나올 때 주어와 동작을 갖춘 문장으로 정의, 같은 산출물 안에서 반복 설명 금지"
level = "review"
method = "claude"
scope = ["all"]
status = "신규"
sources = [
  "전역 지침 style(개념 설명 방식)",
  "skill-vault:skills/narrative-architect/principles/prose-voice.md 2절",
]
note = "업계 용어(하네스, 루프, 래퍼, control plane 등)는 같은 문장이나 다음 문장에 실제 동작을 적는다."
criteria = "이 문서에서 처음 나오는 전문 용어나 약어를 정의 없이 사용했으면 위반입니다. 업계 용어(하네스, 루프, 래퍼, control plane 등)를 사용하면서 실제 동작을 적지 않은 경우도 위반입니다. 같은 문서에서 이미 정의한 용어를 다시 설명한 경우도 지적합니다."

[[rules]]
id = "PRS-PAREN-CONFLATE"
title = "A(B) 괄호 병기로 서로 다른 두 개념을 묶지 않음"
level = "warn"
method = "regex"
scope = ["all"]
status = "신규"
pattern = '[가-힣A-Za-z]{2,}\([가-힣A-Za-z][^)]{1,30}\)'
sources = ["전역 지침 style(개념 설명 방식)"]
note = "오탐이 많아 PR에서 변경된 줄에만 경고를 출력한다. 판정은 Claude 리뷰가 수행한다."

[[rules]]
id = "PRS-ABSTRACT-NOUN"
title = "계층, 구조, 루프 같은 추상 명사로 끝나는 설명을 실제 동작 서술로 교체"
level = "review"
method = "claude"
scope = ["all"]
status = "신규"
sources = ["전역 지침 style(개념 설명 방식)"]
criteria = "설명이 계층, 구조, 루프, 체계, 프레임 같은 추상 명사로 끝나 실제로 무엇이 무엇을 하는지 드러나지 않으면 위반입니다."

[[rules]]
id = "PRS-NOUN-CHAIN"
title = "명사구 3개 이상 연쇄 금지, 동사문으로 분해"
level = "review"
method = "claude"
scope = ["all"]
status = "신규"
sources = [
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1절",
  "skill-vault:skills/narrative-architect/principles/prose-voice.md 1절",
]
bad = "운영 효율성 개선을 위한 자동화 체계 도입 방안"
good = "운영을 자동화해 사람이 직접 처리하는 일을 줄이는 방법"
criteria = "명사구가 셋 이상 이어져 한 번 더 해석해야 뜻이 잡히면 위반입니다. 동사문으로 분해한 수정안을 제시합니다."

[[rules]]
id = "PRS-TONE"
title = "전문가 대 전문가 어조. 강의식, 연출된 문답, 과장 금지"
level = "review"
method = "claude"
scope = ["all"]
status = "신규"
sources = ["skill-vault:skills/narrative-architect/principles/prose-voice.md 3절"]
criteria = "강의식 어조(알아볼까요, 기억해 두세요), 연출된 문답(왜 그럴까요? 바로), 근거 없는 과장(놀랍게도, 무려)이 있으면 위반입니다."

[[rules]]
id = "PRS-TERM-CONSISTENT"
title = "한 단락에서 같은 개념은 한 용어로 통일"
level = "review"
method = "claude"
scope = ["all"]
