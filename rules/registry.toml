# 저장소 프로필
# ---------------------------------------------------------------------------

[profiles.vcf-private-ai]
repo = "JaeHoYun/vcf-private-ai"
title = "VCF Private AI (PAIF) 인프라 가이드"
h1_files = '(^|/)(docs|appendix)/[A-Z]?\d+-[^/]+\.md$'
h1_pattern = '^# [A-Z]?\d+ — \S'
h1_example = "# 05 — 제목"
uses_baseline = true
uses_conventions = true
baseline_extra = "선언 문구와 상세 버전표 규약은 [CONVENTIONS.md](CONVENTIONS.md)를 따릅니다."
form_text = "빈칸을 채우는 양식(워크시트)은 싣지 않습니다. 실제 운영에서 양식이 필요한 내용은 본문에 무엇을, 어떤 기준으로, 누가 언제, 어떻게 측정하고, 어떻게 개선하는지의 다섯 요소로 서술합니다. 수식으로 연쇄 계산해야 하는 내용만 예외로 ⑥ 계산 워크북에 수록합니다. 본문 안의 계산 표는 \"산정 표\"로 부릅니다. AX 가이드는 착수 전 단계의 안내라 양식 없이 끝까지 채운 가상 예시만 싣습니다. 앱 가이드도 같은 원칙을 적용해 양식을 본문 운영 기준으로 통합했고, 계산 도구는 따로 마련하지 않습니다."

[profiles.vcf-private-ai-apps]
repo = "JaeHoYun/vcf-private-ai-apps"
title = "VCF Private AI 앱과 에이전트 서비스 가이드"
h1_files = '(^|/)(docs|appendix)/[A-Z]?\d+-[^/]+\.md$'
h1_pattern = '^# [A-Z]?\d+ — \S'
h1_example = "# 05 — 제목"
uses_baseline = true
uses_conventions = false
form_text = "빈칸을 채우는 양식(워크시트)은 싣지 않습니다. 실제 운영에서 양식이 필요한 내용은 본문에 무엇을, 어떤 기준으로, 누가 언제, 어떻게 측정하고, 어떻게 개선하는지의 다섯 요소로 서술합니다. 수식으로 연쇄 계산해야 하는 내용만 예외로 플랫폼 가이드의 ⑥ 계산 워크북에 수록하고, 이 가이드는 계산 도구를 따로 마련하지 않습니다. 본문 안의 계산 표는 \"산정 표\"로 부릅니다. AX 가이드는 착수 전 단계의 안내라 양식 없이 끝까지 채운 가상 예시만 싣습니다."

[profiles.enterprise-ax-methodology]
repo = "JaeHoYun/enterprise-ax-methodology"
title = "기업용 AX 방법론 가이드"
h1_files = '(^|/)(docs|appendix)/[A-Z]?\d+-[^/]+\.md$'
h1_pattern = '^# [A-Z]?\d+\. \S'
h1_example = "# 03. 제목"
uses_baseline = false
uses_conventions = false
baseline_text = "이 가이드는 벤더 중립이라 특정 제품 버전을 전제하지 않습니다. 기준선 버전과 기준선 태그를 설정하지 않습니다. 제품 버전 기준선({declaration})은 플랫폼 가이드와 앱 가이드에서 관리합니다."
form_title = "안내와 양식의 분리"
form_text = "이 가이드는 착수 전 단계의 안내라 빈칸을 채우는 양식을 수록하지 않습니다. 대신 끝까지 채운 가상 예시를 싣습니다. 플랫폼 가이드와 앱 가이드도 빈칸 양식을 싣지 않고 운영 기준을 본문에 서술합니다. 수식으로 연쇄 계산하는 도구만 플랫폼 가이드의 ⑥ 계산 워크북에 수록합니다."
note = "벤더 중립 가이드라 기준선을 설정하지 않는다. H1 형식은 지금까지 CLAUDE.md에 적혀 있지 않았고 관행으로만 유지됐다."

[profiles.JaeHoYun]
repo = "JaeHoYun/JaeHoYun"
title = "GitHub 프로필 README"
uses_baseline = true
uses_conventions = false
baseline_text = "플랫폼 가이드와 앱 가이드의 기준선({declaration}, {pais_ga} GA)을 README 하단 고지 블록에 표기합니다. 기준선이 바뀌면 고지 블록과 가이드 소개 문장을 함께 고칩니다."
form_title = "양식"
form_text = "README는 가이드를 소개하고 읽는 순서를 안내하는 문서라 양식을 싣지 않습니다. 가이드의 양식 원칙은 각 가이드 저장소의 CLAUDE.md를 따릅니다."
note = "지금까지 CLAUDE.md가 없어 어떤 규칙도 적용되지 않았다."

# ---------------------------------------------------------------------------
# 기호
# ---------------------------------------------------------------------------

[[rules]]
id = "SYM-TILDE"
title = "물결(~) 사용 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "범위 확대"
pattern = '~'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "전역 지침 03",
  "skill-vault:CONTRIBUTING.md 표기",
]
exceptions = ["링크 대상 URL 안의 물결"]
bad = "1~3일"
good = "1–3일"
note = "GitHub는 한 줄에 물결이 두 개면 그 사이를 취소선으로 렌더링한다. 지금까지 vcf-private-ai에서만 검사했다."

[[rules]]
id = "SYM-EMOJI"
title = "이모지 사용 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "범위 확대"
pattern = '[\U0001F300-\U0001FAFF☀-➿⭐⭕]'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "전역 지침 01",
  "skill-vault:CONTRIBUTING.md 표기",
  "skill-vault:skills/pptx-design-system/references/text-rules.md",
]
exceptions = ["화살표(→)", "원숫자(①–⑦)"]

[[rules]]
id = "SYM-MIDDOT"
title = "가운뎃점 사용 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "충돌 정리"
pattern = '[·‧ㆍ]'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-2절",
]
exceptions = ["제품명과 고유명사의 공식 표기"]
bad = "검토·설정"
good = "검토, 설정 / 검토와 설정"
conflict = "C2"
note = "anti-ai-tell 3-1-2절에 따라 변형 문자 U+2027, U+318D도 검사 대상에 추가한다."

[[rules]]
id = "SYM-SECTION"
title = "절 기호와 단락 기호 사용 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "범위 확대"
pattern = '[§¶]'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-3절",
]
bad = "§3.2 참조"
good = "3.2절 참조"
note = "기존 SECTION, PILCROW 검사를 하나로 통합한다."

[[rules]]
id = "SYM-RANGE"
title = "숫자 범위는 en dash(–)로 표기"
level = "warn"
method = "regex"
scope = ["all"]
status = "충돌 정리"
pattern = '(?<![\w.-])\d+-\d+(?![\w.-])'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "세 저장소 CLAUDE.md 대시 규칙의 예외 조항",
]
exceptions = ["날짜(2026-09-03)", "버전과 식별자", "파일명과 경로"]
bad = "3-5개"
good = "3–5개"
conflict = "C1"

# ---------------------------------------------------------------------------
# 대시
# ---------------------------------------------------------------------------

[[rules]]
id = "DASH-JOIN"
title = "두 구를 em dash(—)로 잇는 구조 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "범위 확대"
sources = [
  "vcf-private-ai/CLAUDE.md 문장 규칙 3",
  "vcf-private-ai-apps/CLAUDE.md 규칙 3",
  "enterprise-ax-methodology/CLAUDE.md 3절",
  "전역 지침 00",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-1절",
]
exceptions = [
  "H1의 번호 구분자(프로필의 h1_pattern이 em dash를 사용할 때)",
  "숫자 범위의 en dash",
  "값이 없음을 뜻하는 표의 단독 — 셀",
  "외부 자료 링크 텍스트의 원래 제목과 출처 표기",
]
bad = "단편적 해결의 한계 — 동시 해결 필요"
good = "단편적 해결로는 한계가 있습니다. 동시에 해결해야 합니다."
note = "H2 이하 제목은 마침표로 나눈다(예: ## 5.2 벡터 인덱스 용량. DSM pgvector 산정). 프로필 README에서 현재 6건이 검출된다."

[[rules]]
id = "DASH-HYPHEN-JOIN"
title = "두 구를 공백 낀 하이픈( - )으로 잇는 구조 금지"
level = "warn"
method = "regex"
scope = ["all"]
status = "신규"
pattern = '\S - \S'
allow = ['\d\s-\s', '\s-\s\(?\d']
sources = [
  "전역 지침 00",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-1절",
]
exceptions = ["목록 기호로 시작하는 줄의 첫 하이픈", "숫자 범위", "제품명과 합성어 하이픈"]
bad = "비용 절감 - 라이선스 통합 효과"
good = "라이선스를 통합하면 비용이 줄어듭니다."

[[rules]]
id = "DASH-SUBSTITUTE"
title = "대시를 콜론이나 괄호로 단순 치환 금지"
level = "review"
method = "claude"
scope = ["all"]
status = "문서 규칙만 존재"
sources = [
  "세 저장소 CLAUDE.md 대시 규칙",
  "전역 지침 00",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-1절",
]
bad = "단편적 해결의 한계: 동시 해결 필요"
good = "단편적 해결로는 한계가 있습니다. 동시에 해결해야 합니다."

# ---------------------------------------------------------------------------
# 구조
# ---------------------------------------------------------------------------
criteria = "대시를 지운 자리에 콜론이나 괄호만 넣어 앞뒤 구의 관계가 여전히 생략된 문장이면 위반입니다. 두 문장으로 나누거나 관계를 드러내는 한 문장으로 합쳐야 합니다. 라벨형 `**라벨.** 본문`과 정의 목록은 위반이 아닙니다."

[[rules]]
id = "STR-H1"
title = "문서 H1 형식"
level = "error"
method = "structure"
scope = ["vcf-private-ai", "vcf-private-ai-apps", "enterprise-ax-methodology"]
status = "범위 확대"
sources = [
  "vcf-private-ai/CONVENTIONS.md 3절",
  "vcf-private-ai-apps/CLAUDE.md 규칙 3 예외 조항",
  "enterprise-ax-methodology 관행(문서화되지 않음)",
]
note = "형식은 프로필의 h1_pattern을 따른다. AX만 '# 03. 제목' 형식이다. AX는 현재 12개 문서가 이 형식을 지킨다."

[[rules]]
id = "STR-HEADING-NUMBER"
title = "본문 헤딩 번호 체계(H2 N.M, H3 N.M.K, H4 이하 무번호)"
level = "warn"
method = "structure"
scope = ["vcf-private-ai", "vcf-private-ai-apps", "enterprise-ax-methodology"]
status = "범위 확대"
sources = ["vcf-private-ai/CONVENTIONS.md 4절"]
exceptions = ["메타 섹션(참고 출처, 요약, 면책)", "별도 독자트랙(E0)의 절", "치트시트 절", "부록의 순번 목록형 H3(예: AX A3의 안티패턴 목록)"]
note = "H2 번호는 필수, H3 번호는 구조상 의미 단위일 때만 붙인다. 2026-10-06 측정에서 앱 가이드 H2 133개와 AX H2 68개는 모두 규칙을 지켰다. vcf-private-ai의 번호 없는 H2 15개는 대부분 메타 섹션, E0, 치트시트 예외다. 예외를 모두 등록한 뒤 오류 승격을 검토한다."
allow = ["치트시트"]

[[rules]]
id = "STR-META-UNNUMBERED"
title = "메타 섹션(참고 출처, 요약, 면책)은 무번호"
level = "warn"
method = "structure"
scope = ["vcf-private-ai", "vcf-private-ai-apps", "enterprise-ax-methodology"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CONVENTIONS.md 5절"]

[[rules]]
id = "STR-CIRCLED-HEADING"
title = "본문 헤딩에 원숫자(①②) 사용 금지"
level = "error"
method = "structure"
scope = ["vcf-private-ai"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CONVENTIONS.md 1절"]
allow = ['[①-⑳][^|]*연계', '\([①-⑳][^)]*\)']
note = "원숫자는 다른 편을 가리킬 때만 사용한다."

[[rules]]
id = "STR-FILE-LAYOUT"
title = "파일 배치와 이름(docs/NN-slug.md, appendix/AN-slug.md, docs/E0-*.md)"
level = "error"
method = "structure"
scope = ["vcf-private-ai"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CONVENTIONS.md 2절"]
exceptions = ["06-sizing-cost/worksheet/ 계산 도구"]
allow = ["(^|/)worksheet/"]

[[rules]]
id = "STR-GENERATED-SYNC"
title = "CLAUDE.md와 CONVENTIONS.md의 생성 구간을 직접 고치지 않음"
level = "error"
method = "structure"
scope = ["all"]
status = "신규"
sources = ["이슈 vcf-private-ai#66 결정 D3-a, 생성 위치 가"]
note = "생성 구간을 손으로 고쳐 종료 표시의 sha256과 내용이 다르면 오류다. 레지스트리나 템플릿이 바뀌어 다시 생성해야 하는 상태와 생성 구간이 없는 상태는 경고다."

[[rules]]
