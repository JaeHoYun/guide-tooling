[[rules]]
id = "WORD-ONE-SYLLABLE"
title = "한 글자 동사로 문장을 끝내지 않기"
level = "warn"
method = "wordlist"
scope = ["all"]
status = "문서 규칙만 존재"
sources = [
  "세 저장소 CLAUDE.md 규칙 1",
  "전역 지침 style(동사·은유 표현)",
]
endings = ["풂", "둠", "봄", "늚", "큼", "됨", "씀", "함"]
verbs = ["씁니다", "둡니다", "봅니다", "냅니다", "옵니다", "듭니다"]
replace = [
  ["못 풂", "해결하기 어려움"],
  ["비용이 늚", "비용이 증가함"],
  ["사람이 함", "사람이 직접 수행함"],
  ["씁니다", "사용합니다, 작성합니다, 투입합니다, 지출합니다"],
  ["둡니다", "설정합니다, 수록합니다, 보유합니다"],
  ["봅니다", "확인합니다, 살핍니다, 판단합니다, 측정합니다, 비교합니다"],
]
exceptions = [
  "관용구(여지를 둡니다, 무게를 둡니다)",
  "보조용언(적어 둡니다, 좁혀 갑니다, 보여 줍니다)",
  "뜻이 분명한 표준 표현(있음, 없음, 높음, 낮음, 않음, 가능성이 큽니다)",
  "스토리지 I/O를 뜻하는 쓰기(읽기/쓰기, 쓰기 성능, 쓰기 권한)",
]
note = "단어 목록 검사라 오탐이 많다(예: '적어 둡니다'가 '둡니다'로 검출). 경고로만 운영한다."
detect = [
  ['(?<=\s)(풂|둠|봄|늚|큼|됨|씀|함)(?=\s*(\||$|[.,)]))', "개조식 한 글자 종결"],
  ['(?<![가-힣])(씁니다|쓰는|쓸 |쓰고|쓰이는|쓰인|쓴다)', "쓰다는 사용하다, 작성하다, 투입하다, 지출하다로"],
  ['(?:[을를에]|에게|으로)\s?둡니다', "둡니다는 설정합니다, 수록합니다, 보유합니다로"],
  ['(?:[을를에]|에게|으로)\s?봅니다', "봅니다는 확인합니다, 살핍니다, 판단합니다, 측정합니다, 비교합니다로"],
  ['(?<![가-힣])(냅니다|옵니다|듭니다)', "냅니다, 옵니다, 듭니다는 지불합니다, 나타납니다, 제시합니다로"],
]
allow = ['(여지|무게)를\s?둡니다', '야\s함']

[[rules]]
id = "WORD-GE-DOEDA"
title = "결과의 …게 됩니다, 사물 주어 사역의 …게 합니다, 뜻이 흐린 …이 됩니다를 실제 동사로 교체"
level = "warn"
method = "regex"
scope = ["all"]
status = "문서 규칙만 존재"
pattern = '게 됩니다|게 합니다'
sources = ["세 저장소 CLAUDE.md 규칙 1", "전역 지침 style"]
exceptions = ["…해야 합니다", "…하면 됩니다", "…이기도 합니다", "…해서는 안 됩니다"]
bad = "큰 투자를 하게 됩니다"
good = "큰 투자를 결정하는 셈입니다"
detect = [['게 됩니다|게 된다|게 합니다|게 한다', "…게 됩니다, …게 합니다는 실제 동작 동사로"]]

