  ['(?<![가-힣])꽂[는아고은]', "(점검 목록) 꽂다는 연결하다, 삽입하다로"],
  ['벗어나|벗어난', "(점검 목록) 벗어나다는 실제 관계로"],
  ['떠안', "(점검 목록) 떠안다는 부담하다로"],
  ['들여다보|들여다본', "(점검 목록) 들여다보다는 확인하다, 분석하다로"],
  ['(?<![가-힣])심[는어을]|(?<![가-힣])심은', "심다는 내장하다로"],
  ['신원[이가]?\s?(따라가|끊기|끊긴|끊어)', "신원이 따라가다, 끊기다는 전달되다, 유실되다로"],
  ['들여오|들여와|들여온|(소스|데이터)를\s?들이', "들이다, 들여오다는 인입하다로"],
  ['(?<![가-힣])붙이[는고며다]|(?<![가-힣])붙여|(?<![가-힣])붙인', "붙이다는 연결하다, 추가하다로"],
  ['(보안|정책|제한|권한)이\s?걸[린려]', "걸린은 적용된으로"],
  ['무너지|무너진|무너져', "무너지다는 실패하다로"],
  ['(?<![가-힣])(재는|잰다|잽니다|재야)', "재다는 측정하다로"],
  ['형상관리에\s?두', "형상관리에 두다는 형상관리 저장소에 보관하다로"],
]
allow = [
  "병목", "기술 부채", "청사진", "로드맵", "골든 패스", "상위 계층", "하위 계층",
  '위에서\s?(설명|본|살펴|정리|언급|다룬|제시)', '위에서부터', "결정을 내리", "검증에 들어가", "되돌리",
]

[[rules]]
id = "WORD-TRANSLATIONESE"
title = "번역투 표현 회피"
level = "warn"
method = "wordlist"
scope = ["all"]
status = "신규"
sources = [
  "전역 지침 style(번역투)",
  "skill-vault:skills/narrative-architect/principles/prose-voice.md 1절",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1절",
]
words = ["에 대한", "을 통해", "를 통해", "에 있어서", "와 관련하여", "과 관련하여", "가지고 있다", "제공되어진다", "이는 ~함을 의미합니다"]
replace = [
  ["성능에 있어서의 개선", "성능이 얼마나 좋아지는지"],
  ["비용 절감이 달성될 수 있습니다", "비용을 줄일 수 있습니다"],
  ["여러 고객사들의 요구사항들", "여러 고객사의 요구사항"],
  ["그러므로 이는 ~함을 의미합니다", "따라서 ~입니다"],
]
note = "남용을 규제하는 규칙이라 한 번 사용 자체는 위반이 아니다. 경고는 한 단락 안 반복 사용에만 출력하는 방식을 구현 단계에서 검토한다."
detect = [
  ['에 대한|에 대해', "…에 대한"],
  ['[을를] 통해|[을를] 통하여', "…을 통해"],
  ['에 있어서?(?![가-힣])', "…에 있어서"],
  ['[와과]\s?관련하여|[와과]\s?관련해', "…와 관련하여"],
  ['가지고 있[다습는]', "가지고 있다"],
  ['되어진|되어지', "이중 피동"],
]
min_per_paragraph = 2

[[rules]]
id = "WORD-CLICHE"
title = "근거 없는 상투어 금지"
level = "warn"
method = "wordlist"
scope = ["all"]
status = "신규"
sources = ["skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3절"]
words = [
  "급변하는", "빠르게 변화하는", "더 이상 선택이 아닌 필수",
  "효율성 제고", "경쟁력 강화", "패러다임 전환",
  "압도적", "초격차", "혁신적", "원스톱", "토탈 솔루션", "시너지",
]
exceptions = ["제품명과 고유명사", "인용 원문"]
note = "'차세대'는 제품 세대를 가리키는 정당한 용법이 많아 목록에서 뺐다."

[[rules]]
id = "WORD-QUOTED-HEADLINE"
