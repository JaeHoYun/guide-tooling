[[rules]]
id = "CNT-SOURCE"
title = "수치와 사실 주장에 공식 출처 링크 표기"
level = "warn"
method = "regex"
scope = ["all"]
status = "신규"
sources = [
  "세 저장소 CLAUDE.md 작성 원칙(출처 확인)",
  "전역 지침 06",
  "skill-vault:skills/vcf-korea-ea/SKILL.md 출처 규칙",
]
signals = ["수치와 단위(%, 배, ms, GB, TB, 원, 달러)가 있는 문장인데 같은 단락에 링크도 '확인 필요'도 없음"]
note = "신호 검사는 후보만 제시한다. 출처의 적절성은 Claude 리뷰와 소유자가 판단한다."
number_pattern = '\d[\d,.]*\s?(%|배|ms|GB|TB|억|만 원|원|달러|USD)(?![가-힣A-Za-z])' 

[[rules]]
id = "CNT-UNVERIFIED"
title = "공식 문서로 확인되지 않은 내용은 '확인 필요'로 표시"
level = "review"
method = "claude"
scope = ["all"]
status = "충돌 정리"
sources = ["세 저장소 CLAUDE.md 작성 원칙(출처 확인)"]
conflict = "C5"
note = "공개 가이드는 검증 상태를 독자에게 알리기 위해 표기를 유지한다. 현재 35개 파일에 71건이 있다."
criteria = "공식 출처 링크가 없는 버전 정보, 수치, 제품 동작 서술을 단정형으로 적었으면 위반입니다. 출처 링크를 붙이거나 '확인 필요'로 표시해야 합니다. 일반 원리 설명과 문서 안에서 계산한 값은 대상이 아닙니다."

[[rules]]
id = "CNT-NOT-GA"
title = "발표만 된 기능은 GA 전까지 본문에 반영하지 않음"
level = "warn"
method = "wordlist"
scope = ["vcf-private-ai", "vcf-private-ai-apps", "JaeHoYun"]
status = "신규"
sources = ["세 저장소 CLAUDE.md 작성 원칙(출처 확인)", "전역 지침 vcf_guardrail"]
words = ["출시 예정", "발표 예정", "Tech Preview", "테크 프리뷰", "향후 릴리스"]
exceptions = ["What's New와 버전 이력 절", "알려진 이슈"]
allow_sections = ["What's New", "새 기능", "버전", "이력", "알려진 이슈", "릴리스", "로드맵"]
allow_files = ["whats-new"]

[[rules]]
id = "CNT-BASELINE"
title = "기준선 선언 문구와 버전 표기"
level = "warn"
method = "regex"
scope = ["vcf-private-ai", "vcf-private-ai-apps", "JaeHoYun"]
status = "충돌 정리"
sources = [
  "vcf-private-ai/CONVENTIONS.md 8절",
  "vcf-private-ai/CLAUDE.md 작성 원칙(기준선)",
  "vcf-private-ai-apps/CLAUDE.md 작성 원칙(기준선)",
]
signals = [
  "기준선 선언 문장이 baseline.declaration과 다름",
  "현재형 서술에 이전 버전(PAIS 2.1 등)이 붙음",
]
exceptions = ["What's New의 버전별 기능 이력", "2.1 대 3.0 비교표", "알려진 이슈의 출처 버전", "baseline 태그 안내", "도입 시점 서술(…에서 도입, …부터)"]
conflict = "C3"
old_version_pattern = 'PAIS\s?2\.\d'
allow_sections = ["What's New", "이력", "비교", "알려진 이슈", "출처", "참고"]
allow_files = ["whats-new"]
allow = ['^.*(도입|부터|이전|대비|비교|신규|추가|수정 사항|baseline|태그|업그레이드|마이그레이션|전환|What.s New|릴리스 노트|알려진 이슈|vs).*$']

[[rules]]
id = "CNT-VENDOR-NEUTRAL"
title = "AX 가이드는 벤더 중립, 제품 버전을 전제하지 않음"
level = "warn"
method = "regex"
scope = ["enterprise-ax-methodology"]
status = "신규"
pattern = '\b(VCF|PAIF|PAIS)\s?\d'
