# 문서 규칙 레지스트리 (초안)
#
# 가이드 저장소 4개(vcf-private-ai, vcf-private-ai-apps, enterprise-ax-methodology, JaeHoYun 프로필)에
# 적용하는 문서 규칙의 유일한 원본이다. 각 저장소의 CLAUDE.md 문장 규칙 절, 검증 스크립트의 검사 정의,
# Claude 리뷰 체크리스트는 이 파일에서 생성한다.
#
# skill-vault는 읽기 전용 참조 출처다. 이 파일은 skill-vault 규칙을 옮겨 적고 출처만 기록하며,
# skill-vault 파일을 생성하거나 수정하지 않는다.
#
# 필드
#   id          규칙 ID. 접두어로 분류한다(SYM 기호, DASH 대시, STR 구조, LINK 링크, WORD 어휘,
#               CNT 내용, PRS 문체, PROC 작업 절차, META 저장소 설정값)
#   title       규칙 이름
#   level       error 머지 차단 / warn 후보 출력 후 통과 / review Claude 리뷰와 소유자 확인
#   method      regex, wordlist, structure, link, repo-meta, claude, owner, process
#   scope       적용 프로필 목록. "all"은 프로필 전체
#   status      기존 검사 / 문서 규칙만 존재 / 신규 / 범위 확대 / 충돌 정리
#   sources     원래 출처. skill-vault 출처는 "skill-vault:" 접두어로 표기
#   exceptions  예외. 공통 예외(common_exceptions)는 모든 규칙에 적용
#   bad, good   잘못된 예와 고친 예

schema_version = 1
status = "draft"

common_exceptions = [
  "코드 블록과 인라인 코드",
  "URL",
  "외부 자료의 인용 원문과 원래 제목",
  "고유명사와 제품명의 공식 표기",
]

# 규칙 문서 자체는 금지 대상 기호와 구조를 예시로 인용하므로 기호, 대시, 어휘 검사에서 제외한다.
# 생성된 CLAUDE.md 문장 규칙 절은 예시를 인라인 코드로 감싸 이 예외 없이도 통과하도록 만든다(구현 단계에서 전환).
rule_documents = ["CLAUDE.md", "CONVENTIONS.md"]

# 번호를 붙이지 않는 메타 섹션 제목(번호를 뗀 제목 전체와 일치하는 정규식). STR-HEADING-NUMBER와 STR-META-UNNUMBERED가 사용한다.
meta_titles = ["출처", "참고 출처", "참고 자료", "참고 문헌", "참고", "요약", "면책", "면책 조항", "변경 이력", "관련 문서", "다음 문서"]

# ---------------------------------------------------------------------------
# 기준선
# ---------------------------------------------------------------------------

[baseline]
declaration = "VCF 9.1.1 / PAIF 9.1.1 / PAIS 3.0"
vcf = "9.1.1"
paif = "9.1.1"
pais = "3.0"
pais_ga = "2026-09-03"
previous = "VCF 9.1 / PAIS 2.1"
previous_tag = "baseline-pais-2.1"
note = "가이드 저장소의 기준선이다. skill-vault vcf-korea-ea는 VCF 9.1 / PAIF 9.1 / PAIS 2.1을 유지하며, 차이는 비교표로만 보고한다."

