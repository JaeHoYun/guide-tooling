method = "regex"
scope = ["vcf-private-ai", "vcf-private-ai-apps"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CLAUDE.md 문장 규칙 3", "vcf-private-ai/CONVENTIONS.md 6절", "vcf-private-ai-apps/CLAUDE.md 규칙 3"]
