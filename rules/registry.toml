[[conflicts]]
id = "C1"
topic = "숫자 범위 표기"
sides = ["저장소 규칙: en dash(3–5)", "전역 지침 03: 하이픈(3-5)"]
resolution = "가이드 저장소는 en dash. 전역 지침에 저장소 문서 예외 문구를 추가한다(사용자 조치)."
decision = "D2-a"

[[conflicts]]
id = "C2"
topic = "가운뎃점"
sides = ["CONVENTIONS 7절과 skill-vault anti-ai-tell 3-1-2절: 금지", "전역 지침 03: 사용법을 규정해 허용"]
resolution = "가이드 저장소 전체에서 금지. 전역 지침 03의 가운뎃점 조항을 수정한다(사용자 조치)."
decision = "D2-a"

[[conflicts]]
id = "C3"
topic = "기준선 버전"
sides = [
  "가이드 저장소: VCF 9.1.1 / PAIF 9.1.1 / PAIS 3.0",
  "전역 지침 08: VCF 9.1 / PAIF 9.1",
  "전역 지침 vcf_guardrail: 9.0.x",
  "skill-vault vcf-korea-ea: VCF 9.1 / PAIF 9.1 / PAIS 2.1, paif-positioning.md:47에만 PAIS 3.0",
]
resolution = "레지스트리 baseline 값이 가이드 저장소의 기준. 전역 지침 두 조항은 사용자가 정리한다. skill-vault는 변경하지 않고 차이만 보고한다."
decision = "D2-a, 기준선-가, skill-vault-가"

[[conflicts]]
id = "C4"
topic = "대시 연결 금지의 범위"
sides = ["저장소 규칙: em dash만", "전역 지침 00과 anti-ai-tell 3-1-1절: 공백 낀 하이픈까지"]
resolution = "em dash는 오류(DASH-JOIN), 공백 낀 하이픈은 경고(DASH-HYPHEN-JOIN)로 둘 다 적용한다."
decision = "D2-a, D6-a"

[[conflicts]]
id = "C5"
topic = "미확인 사실 표기"
sides = ["가이드 저장소: '확인 필요'로 표시", "skill-vault anti-ai-tell 3-2절: 산출물에 미해결 라벨 금지"]
resolution = "산출물 종류별로 분리한다. 공개 가이드는 표기를 유지하고, 고객 산출물(슬라이드, 제안서) 규칙은 skill-vault가 그대로 관리한다."
decision = "확인필요-가"

[[conflicts]]
id = "C6"
topic = "skill-vault 내부 모순: 슬래시를 나열 기호로 사용"
sides = ["skill-vault CONTRIBUTING.md: 가운뎃점 대신 쉼표나 슬래시", "skill-vault anti-ai-tell 3-1-2절: 슬래시는 양자택일에만"]
resolution = "가이드 저장소는 anti-ai-tell 기준(쉼표 나열)을 따른다. skill-vault 내부 모순은 보고만 하고 수정하지 않는다."
decision = "skill-vault-가"

[[conflicts]]
id = "C7"
topic = "전역 지침 00의 우선순위 조항"
sides = ["전역 지침 00: 전역 지침이 저장소 CLAUDE.md보다 우선", "결정 D2-a: 저장소 문서에는 저장소 규칙 우선"]
resolution = "전역 지침 00에 '저장소 문서는 해당 저장소 규칙과 guide-tooling 레지스트리를 따른다'는 예외를 추가한다(사용자 조치)."
