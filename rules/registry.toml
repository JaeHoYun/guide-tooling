# 문서 규칙 레지스트리 (초안)
#
# 가이드 저장소 4개(vcf-private-ai, vcf-private-ai-apps, enterprise-ax-methodology, JaeHoYun 프로필)에
# 적용하는 문서 규칙의 유일한 원본이다. 각 저장소의 CLAUDE.md 문장 규칙 절, 검증 스크립트의 검사 정의,
# Claude 리뷰 체크리스트는 이 파일에서 생성한다.
#
# skill-vault는 읽기 전용 참조 출처다. 이 파일은 skill-vault 규칙을 옮겨 적고 출처만 기록하며,
# skill-vault 파일을 생성하거나 수정하지 않는다.
#
# 필드
#   id          규칙 ID. 접두어로 분류한다(SYM 기호, DASH 대시, STR 구조, LINK 링크, WORD 어휘,
#               CNT 내용, PRS 문체, PROC 작업 절차, META 저장소 설정값)
#   title       규칙 이름
#   level       error 머지 차단 / warn 후보 출력 후 통과 / review Claude 리뷰와 소유자 확인
#   method      regex, wordlist, structure, link, repo-meta, claude, owner, process
#   scope       적용 프로필 목록. "all"은 프로필 전체
#   status      기존 검사 / 문서 규칙만 존재 / 신규 / 범위 확대 / 충돌 정리
#   sources     원래 출처. skill-vault 출처는 "skill-vault:" 접두어로 표기
#   exceptions  예외. 공통 예외(common_exceptions)는 모든 규칙에 적용
#   bad, good   잘못된 예와 고친 예

schema_version = 1
status = "draft"

common_exceptions = [
  "코드 블록과 인라인 코드",
  "URL",
  "외부 자료의 인용 원문과 원래 제목",
  "고유명사와 제품명의 공식 표기",
]

# 규칙 문서 자체는 금지 대상 기호와 구조를 예시로 인용하므로 기호, 대시, 어휘 검사에서 제외한다.
# 생성된 CLAUDE.md 문장 규칙 절은 예시를 인라인 코드로 감싸 이 예외 없이도 통과하도록 만든다(구현 단계에서 전환).
rule_documents = ["CLAUDE.md", "CONVENTIONS.md"]

# ---------------------------------------------------------------------------
# 기준선
# ---------------------------------------------------------------------------

[baseline]
declaration = "VCF 9.1.1 / PAIF 9.1.1 / PAIS 3.0"
vcf = "9.1.1"
paif = "9.1.1"
pais = "3.0"
pais_ga = "2026-09-03"
previous_tag = "baseline-pais-2.1"
note = "가이드 저장소의 기준선이다. skill-vault vcf-korea-ea는 VCF 9.1 / PAIF 9.1 / PAIS 2.1을 유지하며, 차이는 비교표로만 보고한다."

# ---------------------------------------------------------------------------
# 저장소 프로필
# ---------------------------------------------------------------------------

[profiles.vcf-private-ai]
repo = "JaeHoYun/vcf-private-ai"
title = "VCF Private AI (PAIF) 인프라 가이드"
h1_files = '(^|/)(docs|appendix)/[A-Z]?\d+-[^/]+\.md$'
h1_pattern = '^# [A-Z]?\d+ — \S'
h1_example = "# 05 — 제목"
uses_baseline = true
uses_conventions = true

[profiles.vcf-private-ai-apps]
repo = "JaeHoYun/vcf-private-ai-apps"
title = "VCF Private AI 앱과 에이전트 서비스 가이드"
h1_files = '(^|/)(docs|appendix)/[A-Z]?\d+-[^/]+\.md$'
h1_pattern = '^# [A-Z]?\d+ — \S'
h1_example = "# 05 — 제목"
uses_baseline = true
uses_conventions = false

[profiles.enterprise-ax-methodology]
repo = "JaeHoYun/enterprise-ax-methodology"
title = "기업용 AX 방법론 가이드"
h1_files = '(^|/)(docs|appendix)/[A-Z]?\d+-[^/]+\.md$'
h1_pattern = '^# [A-Z]?\d+\. \S'
h1_example = "# 03. 제목"
uses_baseline = false
uses_conventions = false
note = "벤더 중립 가이드라 기준선을 설정하지 않는다. H1 형식은 지금까지 CLAUDE.md에 적혀 있지 않았고 관행으로만 유지됐다."

[profiles.JaeHoYun]
repo = "JaeHoYun/JaeHoYun"
title = "GitHub 프로필 README"
uses_baseline = true
uses_conventions = false
note = "지금까지 CLAUDE.md가 없어 어떤 규칙도 적용되지 않았다."

# ---------------------------------------------------------------------------
# 기호
# ---------------------------------------------------------------------------

[[rules]]
id = "SYM-TILDE"
title = "물결(~) 사용 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "범위 확대"
pattern = '~'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "전역 지침 03",
  "skill-vault:CONTRIBUTING.md 표기",
]
exceptions = ["링크 대상 URL 안의 물결"]
bad = "1~3일"
good = "1–3일"
note = "GitHub는 한 줄에 물결이 두 개면 그 사이를 취소선으로 렌더링한다. 지금까지 vcf-private-ai에서만 검사했다."

[[rules]]
id = "SYM-EMOJI"
title = "이모지 사용 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "범위 확대"
pattern = '[\U0001F300-\U0001FAFF☀-➿⭐⭕]'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "전역 지침 01",
  "skill-vault:CONTRIBUTING.md 표기",
  "skill-vault:skills/pptx-design-system/references/text-rules.md",
]
exceptions = ["화살표(→)", "원숫자(①–⑦)"]

[[rules]]
id = "SYM-MIDDOT"
title = "가운뎃점 사용 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "충돌 정리"
pattern = '[·‧ㆍ]'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-2절",
]
exceptions = ["제품명과 고유명사의 공식 표기"]
bad = "검토·설정"
good = "검토, 설정 / 검토와 설정"
conflict = "C2"
note = "anti-ai-tell 3-1-2절에 따라 변형 문자 U+2027, U+318D도 검사 대상에 추가한다."

[[rules]]
id = "SYM-SECTION"
title = "절 기호와 단락 기호 사용 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "범위 확대"
pattern = '[§¶]'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-3절",
]
bad = "§3.2 참조"
good = "3.2절 참조"
note = "기존 SECTION, PILCROW 검사를 하나로 통합한다."

[[rules]]
id = "SYM-RANGE"
title = "숫자 범위는 en dash(–)로 표기"
level = "warn"
method = "regex"
scope = ["all"]
status = "충돌 정리"
pattern = '(?<![\w.-])\d+-\d+(?![\w.-])'
sources = [
  "vcf-private-ai/CONVENTIONS.md 7절",
  "세 저장소 CLAUDE.md 대시 규칙의 예외 조항",
]
exceptions = ["날짜(2026-09-03)", "버전과 식별자", "파일명과 경로"]
bad = "3-5개"
good = "3–5개"
conflict = "C1"

# ---------------------------------------------------------------------------
# 대시
# ---------------------------------------------------------------------------

[[rules]]
id = "DASH-JOIN"
title = "두 구를 em dash(—)로 잇는 구조 금지"
level = "error"
method = "regex"
scope = ["all"]
status = "범위 확대"
sources = [
  "vcf-private-ai/CLAUDE.md 문장 규칙 3",
  "vcf-private-ai-apps/CLAUDE.md 규칙 3",
  "enterprise-ax-methodology/CLAUDE.md 3절",
  "전역 지침 00",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-1절",
]
exceptions = [
  "H1의 번호 구분자(프로필의 h1_pattern이 em dash를 사용할 때)",
  "숫자 범위의 en dash",
  "값이 없음을 뜻하는 표의 단독 — 셀",
  "외부 자료 링크 텍스트의 원래 제목과 출처 표기",
]
bad = "단편적 해결의 한계 — 동시 해결 필요"
good = "단편적 해결로는 한계가 있습니다. 동시에 해결해야 합니다."
note = "H2 이하 제목은 마침표로 나눈다(예: ## 5.2 벡터 인덱스 용량. DSM pgvector 산정). 프로필 README에서 현재 6건이 검출된다."

[[rules]]
id = "DASH-HYPHEN-JOIN"
title = "두 구를 공백 낀 하이픈( - )으로 잇는 구조 금지"
level = "warn"
method = "regex"
scope = ["all"]
status = "신규"
pattern = '\S - \S'
sources = [
  "전역 지침 00",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-1절",
]
exceptions = ["목록 기호로 시작하는 줄의 첫 하이픈", "숫자 범위", "제품명과 합성어 하이픈"]
bad = "비용 절감 - 라이선스 통합 효과"
good = "라이선스를 통합하면 비용이 줄어듭니다."

[[rules]]
id = "DASH-SUBSTITUTE"
title = "대시를 콜론이나 괄호로 단순 치환 금지"
level = "review"
method = "claude"
scope = ["all"]
status = "문서 규칙만 존재"
sources = [
  "세 저장소 CLAUDE.md 대시 규칙",
  "전역 지침 00",
  "skill-vault:skills/narrative-architect/principles/anti-ai-tell.md 3-1-1절",
]
bad = "단편적 해결의 한계: 동시 해결 필요"
good = "단편적 해결로는 한계가 있습니다. 동시에 해결해야 합니다."

# ---------------------------------------------------------------------------
# 구조
# ---------------------------------------------------------------------------

[[rules]]
id = "STR-H1"
title = "문서 H1 형식"
level = "error"
method = "structure"
scope = ["vcf-private-ai", "vcf-private-ai-apps", "enterprise-ax-methodology"]
status = "범위 확대"
sources = [
  "vcf-private-ai/CONVENTIONS.md 3절",
  "vcf-private-ai-apps/CLAUDE.md 규칙 3 예외 조항",
  "enterprise-ax-methodology 관행(문서화되지 않음)",
]
note = "형식은 프로필의 h1_pattern을 따른다. AX만 '# 03. 제목' 형식이다. AX는 현재 12개 문서가 이 형식을 지킨다."

[[rules]]
id = "STR-HEADING-NUMBER"
title = "본문 헤딩 번호 체계(H2 N.M, H3 N.M.K, H4 이하 무번호)"
level = "warn"
method = "structure"
scope = ["vcf-private-ai"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CONVENTIONS.md 4절"]
exceptions = ["메타 섹션(참고 출처, 요약, 면책)", "별도 독자트랙(E0)", "치트시트 절"]
note = "시험 실행에서 11곳이 검출됐고 대부분 예외였다. 앱 가이드와 AX 적용 여부는 확인 필요."

[[rules]]
id = "STR-META-UNNUMBERED"
title = "메타 섹션(참고 출처, 요약, 면책)은 무번호"
level = "warn"
method = "structure"
scope = ["vcf-private-ai"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CONVENTIONS.md 5절"]

[[rules]]
id = "STR-CIRCLED-HEADING"
title = "본문 헤딩에 원숫자(①②) 사용 금지"
level = "error"
method = "structure"
scope = ["vcf-private-ai"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CONVENTIONS.md 1절"]
note = "원숫자는 다른 편을 가리킬 때만 사용한다."

[[rules]]
id = "STR-FILE-LAYOUT"
title = "파일 배치와 이름(docs/NN-slug.md, appendix/AN-slug.md, docs/E0-*.md)"
level = "error"
method = "structure"
scope = ["vcf-private-ai"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CONVENTIONS.md 2절"]
exceptions = ["06-sizing-cost/worksheet/ 계산 도구"]

[[rules]]
id = "STR-LABEL"
title = "라벨형 문장은 **라벨.** 본문 형식, 질문형 라벨은 물음표로 종결"
level = "warn"
method = "regex"
scope = ["all"]
status = "문서 규칙만 존재"
pattern = '\*\*[^*]+\*\*\s*[:—-]'
sources = ["세 저장소 CLAUDE.md 대시 규칙"]
bad = "**배경**: 본문"
good = "**배경.** 본문"

[[rules]]
id = "STR-NO-FORM"
title = "빈칸을 채우는 양식 금지"
level = "warn"
method = "structure"
scope = ["all"]
status = "신규"
sources = [
  "세 저장소 CLAUDE.md 작성 원칙(양식 대신 운영 기준, 안내와 양식의 분리)",
  "vcf-private-ai/CONVENTIONS.md 2절",
]
signals = ["빈 셀이 절반 이상인 표", "밑줄 빈칸(____)", "체크박스([ ])"]
exceptions = ["06-sizing-cost/worksheet/ 계산 도구"]
note = "프로필 README에 '채워 쓰는 양식은 ⑤, ⑥, ⑦에 있습니다'라는 문장이 남아 있다."

[[rules]]
id = "STR-CALC-TABLE-TERM"
title = "본문 안의 계산 표는 '산정 표'로 지칭"
level = "warn"
method = "wordlist"
scope = ["vcf-private-ai", "vcf-private-ai-apps"]
status = "문서 규칙만 존재"
words = ["계산 표", "계산표", "워크시트"]
exceptions = ["⑥ 계산 워크북을 가리키는 문장"]
sources = ["vcf-private-ai/CLAUDE.md 작성 원칙", "vcf-private-ai-apps/CLAUDE.md 작성 원칙"]

[[rules]]
id = "STR-CODE-FENCE"
title = "코드 펜스는 실제 코드와 마크업에만 사용"
level = "review"
method = "claude"
scope = ["all"]
status = "신규"
sources = ["전역 지침 03"]

# ---------------------------------------------------------------------------
# 링크
# ---------------------------------------------------------------------------

[[rules]]
id = "LINK-TARGET"
title = "상대 링크, 앵커, 저장소 간 링크의 대상 존재"
level = "error"
method = "link"
scope = ["all"]
status = "범위 확대"
sources = [
  "vcf-private-ai/verify_repo.py LINK",
  "세 저장소 CLAUDE.md 고칠 때의 원칙(앵커 링크 확인)",
]
exceptions = ["main이 아닌 태그와 커밋에 고정된 링크"]
note = "Actions에서는 형제 저장소를 함께 checkout해 저장소 간 링크까지 검사한다."

[[rules]]
id = "LINK-TEXT"
title = "다른 문서를 가리키는 링크 텍스트는 문서 번호와 제목으로 작성"
level = "warn"
method = "regex"
scope = ["vcf-private-ai", "vcf-private-ai-apps"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CLAUDE.md 문장 규칙 3", "vcf-private-ai/CONVENTIONS.md 6절", "vcf-private-ai-apps/CLAUDE.md 규칙 3"]
bad = "[03 — ID, 인증, 접근통제]"
good = "[03 ID, 인증, 접근통제]"

[[rules]]
id = "LINK-XREF"
title = "상호참조는 'N.M절', 다른 편은 '시리즈 ④의 2.3절' 형식"
level = "review"
method = "claude"
scope = ["vcf-private-ai"]
status = "문서 규칙만 존재"
sources = ["vcf-private-ai/CONVENTIONS.md 6절"]

# ---------------------------------------------------------------------------
# 어휘
# ---------------------------------------------------------------------------

[[rules]]
id = "WORD-ONE-SYLLABLE"
title = "한 글자 동사로 문장을 끝내지 않기"
level = "warn"
method = "wordlist"
scope = ["all"]
status = "문서 규칙만 존재"
sources = [
  "세 저장소 CLAUDE.md 규칙 1",
  "전역 지침 style(동사·은유 표현)",
]
endings = ["풂", "둠", "봄", "늚", "큼", "됨", "씀", "함"]
verbs = ["씁니다", "둡니다", "봅니다", "냅니다", "옵니다", "듭니다"]
replace = [
  ["못 풂", "해결하기 어려움"],
  ["비용이 늚", "비용이 증가함"],
  ["사람이 함", "사람이 직접 수행함"],
  ["씁니다", "사용합니다, 작성합니다, 투입합니다, 지출합니다"],
  ["둡니다", "설정합니다, 수록합니다, 보유합니다"],
  ["봅니다", "확인합니다, 살핍니다, 판단합니다, 측정합니다, 비교합니다"],
]
exceptions = [
  "관용구(여지를 둡니다, 무게를 둡니다)",
  "보조용언(적어 둡니다, 좁혀 갑니다, 보여 줍니다)",
  "뜻이 분명한 표준 표현(있음, 없음, 높음, 낮음, 않음, 가능성이 큽니다)",
  "스토리지 I/O를 뜻하는 쓰기(읽기/쓰기, 쓰기 성능, 쓰기 권한)",
]
note = "단어 목록 검사라 오탐이 많다(예: '적어 둡니다'가 '둡니다'로 검출). 경고로만 운영한다."

[[rules]]
id = "WORD-GE-DOEDA"
title = "결과의 …게 됩니다, 사물 주어 사역의 …게 합니다, 뜻이 흐린 …이 됩니다를 실제 동사로 교체"
level = "warn"
method = "regex"
scope = ["all"]
status = "문서 규칙만 존재"
pattern = '게 됩니다|게 합니다'
sources = ["세 저장소 CLAUDE.md 규칙 1", "전역 지침 style"]
